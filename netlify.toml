[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API routes must come before the SPA fallback
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback so /Game, /Signup and /Confirm survive a refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
